services:

  oracle-db:
    image: gvenzl/oracle-xe:21-slim
    container_name: oracle-db

    environment:
      ORACLE_PASSWORD: ${ORACLE_PASSWORD:?defina ORACLE_PASSWORD no arquivo .env}
      APP_USER: ${ORACLE_APP_USER:-clyvovet}
      APP_USER_PASSWORD: ${ORACLE_APP_PASSWORD:-${ORACLE_PASSWORD:?defina ORACLE_PASSWORD no arquivo .env}}

    ports:
      - "127.0.0.1:1521:1521"

    volumes:
      - oracle_data:/opt/oracle/oradata

    healthcheck:
      test: ["CMD", "healthcheck.sh"]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 60s

  mongo-db:
    image: mongo:8.0
    ports:
      - "127.0.0.1:27017:27017"
    volumes:
      - mongo_data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "quit(db.adminCommand('ping').ok ? 0 : 1)"]
      interval: 10s
      timeout: 5s
      retries: 10

  api:
    build: .
    container_name: clyvovet-api

    ports:
      - "8080:8080"

    depends_on:
      oracle-db:
        condition: service_healthy
      mongo-db:
        condition: service_healthy

    environment:
      ASPNETCORE_URLS: http://+:8080
      # Segredos vem do .env (local) ou do provedor de nuvem (deploy).
      # Nenhum destes valores esta versionado no appsettings.json.
      ConnectionStrings__OracleConnection: ${ConnectionStrings__OracleConnection:?defina ConnectionStrings__OracleConnection no arquivo .env}
      Mongo__ConnectionString: mongodb://mongo-db:27017
      Mongo__DatabaseName: ${Mongo__DatabaseName:-clyvovet}
      Auth__Username: ${Auth__Username:?defina Auth__Username no arquivo .env}
      Auth__Password: ${Auth__Password:?defina Auth__Password no arquivo .env}
      Auth__SigningKey: ${Auth__SigningKey:?defina Auth__SigningKey no arquivo .env}

volumes:
  oracle_data:
  mongo_data:
